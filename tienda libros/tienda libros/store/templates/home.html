{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4 text-center">Bienvenido a nuestra Librería</h1>

    <!-- Filtros de libros -->
    <div class="mb-4 text-center">
        <button class="btn btn-outline-primary mx-2" onclick="fetchAndRenderBooks('')">Todos</button>
        <button class="btn btn-outline-primary mx-2" onclick="fetchAndRenderBooks('ficcion')">Ficción</button>
        <button class="btn btn-outline-primary mx-2" onclick="fetchAndRenderBooks('no-ficcion')">No Ficción</button>
        <button class="btn btn-outline-primary mx-2" onclick="fetchAndRenderBooks('ciencia')">Ciencia</button>
        <button class="btn btn-outline-primary mx-2" onclick="fetchAndRenderBooks('fantasia')">Fantasía</button>
    </div>

    <div id="books-container" class="row">
        <!-- Los libros se renderizarán aquí con Handlebars -->
    </div>
</div>

<!-- Handlebars Template -->
<script id="book-template" type="text/x-handlebars-template">
    {{#each this}}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            {{#if fields.cover_image}}
                <img src="/media/{{fields.cover_image}}" class="card-img-top" style="height: 250px; object-fit: cover;" alt="{{fields.title}}">
            {{else}}
                <div class="bg-light text-center p-5" style="height: 250px; display: flex; align-items: center; justify-content: center;">
                    <h5 class="text-muted">Sin portada</h5>
                </div>
            {{/if}}
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{fields.title}}</h5>
                <p class="card-text text-muted">{{fields.author}}</p>
                <p class="card-text"><strong>Precio: ${{fields.price}}</strong></p>
                <div class="mt-auto">
                    <a href="/book/{{pk}}/" class="btn btn-primary btn-sm">Ver Detalles</a>
                </div>
            </div>
        </div>
    </div>
    {{/each}}
</script>

<script>
    const booksContainer = document.getElementById('books-container');
    const bookTemplateSource = document.getElementById('book-template').innerHTML;
    const bookTemplate = Handlebars.compile(bookTemplateSource);

    async function fetchAndRenderBooks(type = '') {
        let url = '/api/books/';
        if (type) {
            url += `?tipo=${type}`; // Asumiendo que tu API puede filtrar por tipo
        }
        try {
            const response = await fetch(url);
            const data = await response.json();
            const parsedData = JSON.parse(data); // La respuesta de Django serializers es una cadena JSON
            booksContainer.innerHTML = bookTemplate(parsedData);
        } catch (error) {
            console.error('Error fetching books:', error);
            booksContainer.innerHTML = '<p class="text-center text-danger">Error al cargar los libros.</p>';
        }
    }

    // Cargar todos los libros al inicio
    document.addEventListener('DOMContentLoaded', () => {
        fetchAndRenderBooks();
    });
</script>
{% endblock %}
