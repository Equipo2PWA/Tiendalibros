{% extends 'layout/base.html' %}
{% load static %}

{% block title %}Librería{% endblock %}

{% block content %}
<div class="hero-section">
    <div class="hero-button-container">
        <a href="#libros" class="btn btn-primary btn-lg">Explorar Libros</a>
    </div>
</div>

<div class="container my-4" id="libros">
    <h2 class="mb-4">Nuestros Libros</h2>
    
    <!-- Barra de búsqueda -->
    <div class="mb-4">
        <div class="input-group">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar por título o autor...">
            <button class="btn btn-primary" onclick="searchBooks()">Buscar</button>
        </div>
    </div>
    
    <!-- Filtros -->
    <div class="btn-group mb-4" role="group">
        <button class="btn btn-outline-primary active" onclick="loadBooks('all')">Todos</button>
        <button class="btn btn-outline-success" onclick="loadBooks('virtual')">Libros Virtuales (Leer Gratis)</button>
        <button class="btn btn-outline-danger" onclick="loadBooks('fisico')">Libros Físicos (Comprar)</button>
    </div>
    
    <!-- Contador -->
    <p class="text-muted" id="bookCount">Cargando libros...</p>
    
    <!-- Loader -->
    <div id="loader" class="text-center my-5" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="mt-2">Cargando libros...</p>
    </div>
    
    <!-- Contenedor de libros -->
    <div id="booksContainer" class="row g-4"></div>
    
    <!-- Mensaje de error -->
    <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>
</div>

{% verbatim %}
<script id="book-template" type="text/x-handlebars-template">
    {{#each books}}
    <div class="col-md-4 mb-4 book-fade-in">
        {{!-- La card entera es clickeable para ir al detalle --}}
        <div class="card h-100 shadow-sm book-card"
             data-book-id="{{id}}"
             style="cursor: pointer;"
             onclick="goToBook(event, {{id}})">

            {{#if cover_image_url}}
                <img src="{{cover_image_url}}"
                     class="card-img-top"
                     style="height: 250px; object-fit: cover;"
                     alt="{{title}}">
            {{else}}
                <div class="bg-light text-center p-5" style="height: 250px;">
                    <h5 class="text-muted">Sin portada</h5>
                </div>
            {{/if}}
            <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{title}}</h5>
                <p class="card-text text-muted">por {{author}}</p>
                <p class="card-text"><strong>${{price}}</strong></p>
                <p class="card-text small">{{description}}</p>
                {{#if uploaded_by_username}}
                    <p class="card-text small text-muted">Subido por: {{uploaded_by_username}}</p>
                {{/if}}
                <div class="mt-auto">
                    {{#if is_virtual}}
                        {{!-- Detiene propagación para no ir al detalle --}}
                        <a href="/read/{{id}}/"
                           class="btn btn-success w-100"
                           onclick="event.stopPropagation()">
                            Leer Ahora
                        </a>
                    {{else}}
                        {{#if (gt stock 0)}}
                            <button class="btn btn-primary w-100"
                                    onclick="event.stopPropagation(); addToCart({{id}}, this)">
                                Agregar al carrito (Stock: {{stock}})
                            </button>
                        {{else}}
                            <button class="btn btn-secondary w-100" disabled>Sin Stock</button>
                        {{/if}}
                    {{/if}}
                </div>
            </div>

            <div class="card-footer text-center small">
                {{#if is_virtual}}
                    <span class="badge bg-success">Lectura Online Gratis</span>
                {{else}}
                    <span class="badge bg-danger">Libro Físico</span>
                {{/if}}
            </div>
        </div>
    </div>
    {{/each}}
</script>
{% endverbatim %}

<script src="https://cdn.jsdelivr.net/npm/handlebars@latest/dist/handlebars.js"></script>

<script>
let currentFilter = 'all';

Handlebars.registerHelper('gt', (a, b) => a > b);

function goToBook(event, bookId) {
    window.location.href = `/book/${bookId}/`;
}

function showLoader() {
    document.getElementById('loader').style.display = 'block';
    document.getElementById('booksContainer').style.display = 'none';
    document.getElementById('errorMessage').style.display = 'none';
}

function hideLoader() {
    document.getElementById('loader').style.display = 'none';
    document.getElementById('booksContainer').style.display = 'flex';
}

function showError(message) {
    const errorDiv = document.getElementById('errorMessage');
    errorDiv.textContent = message;
    errorDiv.style.display = 'block';
    hideLoader();
}

function loadBooks(filterType = null) {
    if (filterType) {
        currentFilter = filterType;
        document.querySelectorAll('.btn-group button').forEach(btn => btn.classList.remove('active'));
        if (event && event.currentTarget?.tagName === 'BUTTON') {
            event.currentTarget.classList.add('active');
        }
    }

    const searchTerm = document.getElementById('searchInput').value.trim();
    showLoader();

    let url = `/api/books/?tipo=${currentFilter}`;
    if (searchTerm) url += `&q=${encodeURIComponent(searchTerm)}`;

    fetch(url)
        .then(r => r.json())
        .then(data => {
            hideLoader();
            const books = Array.isArray(data) ? data : (data.results || []);
            renderBooks(books);
        })
        .catch(err => {
            console.error(err);
            showError('Error al cargar los libros. Intenta de nuevo.');
        });
}

function renderBooks(books) {
    const container = document.getElementById('booksContainer');
    const countText = document.getElementById('bookCount');

    if (books && books.length > 0) {
        const source   = document.getElementById('book-template').innerHTML;
        const template = Handlebars.compile(source);
        container.innerHTML = template({ books });
        countText.innerHTML = `Mostrando <strong>${books.length}</strong> libro${books.length !== 1 ? 's' : ''}`;

        container.querySelectorAll('.book-fade-in').forEach((card, i) => {
            card.style.animationDelay = `${i * 0.1}s`;
        });
    } else {
        container.innerHTML = `
            <div class="col-12 text-center my-5">
                <div class="alert alert-info">No se encontraron libros.</div>
            </div>`;
        countText.innerHTML = '0 libros encontrados';
    }
}

function searchBooks() {
    loadBooks();
}

function addToCart(bookId, btn) {
    const originalText = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'Agregando...';

    fetch(`/api/cart/add/${bookId}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({})
    })
    .then(res => {
        if (res.status === 401 || res.status === 403) {
            window.location.href = '/login/';
            return null;
        }
        return res.json();
    })
    .then(async data => {
        if (!data) return;

        if (data.status === 'success') {
            if (window.CartDB) {
                const cartRes  = await fetch('/api/cart/items/');
                const cartData = await cartRes.json();
                const item     = cartData.items?.find(i => i.book_id === bookId);
                if (item) await CartDB.saveItem(item);
                CartDB.refresh();
            }

            btn.textContent = '✓ Añadido';
            btn.classList.replace('btn-primary', 'btn-success');
            setTimeout(() => {
                btn.textContent = originalText;
                btn.classList.replace('btn-success', 'btn-primary');
                btn.disabled = false;
            }, 1500);

        } else {
            alert(data.message || 'Error al agregar al carrito');
            btn.textContent = originalText;
            btn.disabled = false;
        }
    })
    .catch(err => {
        console.error('Error:', err);
        alert('Hubo un error al procesar la solicitud.');
        btn.textContent = originalText;
        btn.disabled = false;
    });
}

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
    return null;
}

document.addEventListener('DOMContentLoaded', () => {
    loadBooks('all');

    document.getElementById('searchInput')
        ?.addEventListener('keypress', e => {
            if (e.key === 'Enter') searchBooks();
        });
});
</script>

{% endblock %}
